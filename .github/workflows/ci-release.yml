name: Tests and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: Security and syntax tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest<9" pytest-homeassistant-custom-component segno==1.6.6

      - name: Run pytest
        run: python -m pytest

      - name: Compile Python
        run: python -m compileall -q custom_components tests

      - name: Validate JSON
        run: |
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/secure_qr_login/manifest.json >/dev/null
          python -m json.tool custom_components/secure_qr_login/strings.json >/dev/null
          python -m json.tool custom_components/secure_qr_login/translations/en.json >/dev/null
          python -m json.tool custom_components/secure_qr_login/translations/el.json >/dev/null

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check custom_components/secure_qr_login/www/static/admin.js
          node --check custom_components/secure_qr_login/www/static/approve.js
          node --check custom_components/secure_qr_login/www/static/start.js

  release:
    name: Publish versioned GitHub release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read integration version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import json
          with open("custom_components/secure_qr_login/manifest.json", encoding="utf-8") as f:
              print(json.load(f)["version"])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release if version is new
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Secure QR Login $TAG" \
            --generate-notes
