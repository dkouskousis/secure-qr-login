<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Approve Secure QR Login</title>
  <link rel="stylesheet" href="/secure_qr_login/static/app.css">
</head>
<body class="auth-page">
  <main class="card">
    <h1>Approve login</h1>
    <p class="muted">Confirm that this is the device currently showing the QR code.</p>

    <section id="details" hidden>
      <div class="row"><span>Account</span><span id="account" class="value"></span></div>
      <div class="row"><span>IP</span><span id="ip" class="value"></span></div>
      <div class="row"><span>Browser</span><span id="agent" class="value"></span></div>
      <div class="buttons">
        <button id="approve" class="approve">Approve</button>
        <button id="deny" class="deny">Deny</button>
      </div>
    </section>

    <div id="authActions" class="buttons" hidden>
      <a id="openApp" class="button app">Open in Home Assistant app</a>
      <a id="browserLogin" class="button approve">Sign in in browser</a>
    </div>

    <p id="message" class="muted">Checking authentication…</p>
  </main>
  <script src="/secure_qr_login/static/approve.js"></script>
</body>
</html>
