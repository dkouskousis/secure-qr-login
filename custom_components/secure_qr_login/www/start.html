<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Secure QR Login</title>
  <style>
    :root{font-family:system-ui,-apple-system,sans-serif;color-scheme:light dark}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;padding:20px}
    .card{width:min(420px,100%);background:#1c1c1c;border-radius:16px;padding:28px;box-sizing:border-box;text-align:center}
    h1{margin:0 0 8px;font-size:25px}.muted{color:#aaa}.error{color:#ff6b6b}.ok{color:#68d391}
    #qr{width:280px;height:280px;margin:24px auto;background:#fff;border-radius:12px;padding:12px;box-sizing:border-box}
    #qr img{width:100%;height:100%;display:block}.bar{height:5px;background:#333;border-radius:99px;overflow:hidden;margin-top:14px}
    #progress{height:100%;background:#03a9f4;transform-origin:left}
  </style>
</head>
<body>
  <main class="card">
    <h1>Secure QR Login</h1>
    <p class="muted">Scan with a browser or Home Assistant app where you are already signed in.</p>
    <div id="qr"><span class="muted">Preparing QR…</span></div>
    <div class="bar"><div id="progress"></div></div>
    <p id="state" class="muted">Waiting for approval…</p>
  </main>
  <script src="/secure_qr_login/static/start.js"></script>
</body>
</html>
